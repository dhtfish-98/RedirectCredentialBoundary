[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "redirect-credential-boundary"
version = "0.1.0"
description = "Bound credential forwarding across HTTP redirect origins"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "dhtfish98" }]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Internet :: WWW/HTTP",
]

[tool.hatch.build.targets.wheel]
packages = ["src/redirect_credential_boundary"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/pyproject.toml",
  "/LICENSE",
]
